
version = 1

test_patterns = [
  "**/*Tests.cs",
  "**/test/**"
]

exclude_patterns = [
  "**/bin/**",
  "**/obj/**",
  "**/Migrations/**"
]

[[analyzers]]
name = "csharp"
enabled = true

  [analyzers.meta]
  runtime_version = "net10.0"

  [analyzers.meta.thresholds]
  coverage = 80.0 

[[transformers]]
name = "csharp-formatting"
enabled = true